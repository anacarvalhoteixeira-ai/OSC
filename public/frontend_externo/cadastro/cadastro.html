
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | UOSCC</title>
    <link rel="stylesheet" href="./cadastro.css">
</head>
<body>

    <main class="pagina-login">
        <section class="card-login">

            <header class="cabecalho">
                <div class="logo">U</div>

                <div class="identidade">
                    <h1>UOSCC</h1>
                    <p>Rede de OSCs • Camaçari</p>
                </div>
            </header>

            <div class="conteudo">
                <div class="introducao">
                    <span class="etiqueta">FAÇA PARTE DA REDE</span>
                    <h2>Crie sua conta!</h2>
                    <p>Preencha os dados para solicitar seu acesso.</p>
                </div>

                <form action="#" method="post">
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@exemplo.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="organizacao">Organização</label>
                        <input
                            type="text"
                            id="organizacao"
                            name="organizacao"
                            placeholder="Nome da sua OSC"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="confirmar-senha">Confirmar senha</label>
                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar_senha"
                            placeholder="Digite a senha novamente"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button type="submit" class="botao">
                        Solicitar cadastro <span>→</span>
                    </button>
                </form>

                <div class="alternativa">
                    <p>Já possui uma conta?</p>
                    <a href="../login/login.html" class="link">
                        Fazer login
                    </a>
                </div>

                <footer class="rodape">
                    Unindo forças para fortalecer organizações.
                </footer>
            </div>

        </section>

        <p class="legenda">
            UOSCC · Unindo forças, transformando comunidades.
        </p>
    </main>

    <script src="./cadastro.js"></script>
</body>
</html>
