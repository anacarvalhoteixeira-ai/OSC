<section id="pagina-ficha-osc" data-pagina class="hidden">
          <header
            class="mb-6 flex flex-wrap items-center justify-between gap-4"
          >
            <div>
              <h2
                id="ficha-osc-nome"
                class="text-2xl font-bold text-[#122957] dark:text-white"
              >
                Ficha da OSC
              </h2>
              <p
                id="ficha-osc-categoria"
                class="mt-1 text-sm text-slate-500 dark:text-slate-400"
              ></p>
            </div>
            <div class="flex gap-3">
              <button type="button" data-secao="oscs" class="btn-secundario">
                Voltar
              </button>
              <button
                id="botao-editar-osc-ficha"
                type="button"
                data-action="editar-osc"
                class="btn-primario"
              >
                Editar OSC
              </button>
            </div>
          </header>

          <div class="max-w-3xl space-y-6">
            <section
              class="rounded-xl border border-slate-200 bg-white p-5 dark:border-slate-700 dark:bg-slate-800"
            >
              <h3 class="mb-3 font-bold text-[#122957] dark:text-white">
                Dados da organização
              </h3>

              <dl
                id="ficha-osc-dados"
                class="grid gap-2 text-sm sm:grid-cols-2"
              ></dl>
              <p class="mt-4 text-sm">
                <strong>Total de pessoas atendidas (soma dos projetos):</strong>
                <span id="ficha-osc-pessoas">0</span>
              </p>
            </section>

            <section
              class="rounded-xl border border-slate-200 bg-white p-5 dark:border-slate-700 dark:bg-slate-800"
            >
              <h3 class="mb-3 font-bold text-[#122957] dark:text-white">
                Projetos desta OSC
              </h3>
              <ul id="ficha-osc-projetos" class="space-y-2 text-sm"></ul>
              <p
                id="ficha-osc-sem-projetos"
                class="text-sm text-slate-500 dark:text-slate-400"
              >
                Nenhum projeto cadastrado para esta OSC.
              </p>
            </section>

            <section
              class="rounded-xl border border-slate-200 bg-white p-5 dark:border-slate-700 dark:bg-slate-800"
            >
              <h3 class="mb-3 font-bold text-[#122957] dark:text-white">
                Demandas desta OSC
              </h3>
              <ul id="ficha-osc-demandas" class="space-y-2 text-sm"></ul>
              <p
                id="ficha-osc-sem-demandas"
                class="text-sm text-slate-500 dark:text-slate-400"
              >
                Nenhuma demanda cadastrada para esta OSC.
              </p>
            </section>
          </div>
        </section>
