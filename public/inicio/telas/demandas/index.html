<section
          id="pagina-demandas"
          data-pagina
          class="hidden"
          aria-labelledby="titulo-demandas"
        >
          <header
            class="mb-6 flex flex-wrap items-center justify-between gap-4"
          >
            <h2
              id="titulo-demandas"
              class="text-2xl font-bold text-[#122957] dark:text-white"
            >
              Demandas cadastradas
            </h2>
            <button
              id="botao-nova-demanda"
              type="button"
              data-action="abrir-formulario-demanda"
              class="btn-primario"
            >
              + Nova demanda
            </button>
          </header>

          <section class="mb-5" aria-label="Pesquisa de demandas">
            <form
              id="form-pesquisa-demandas"
              class="flex flex-col gap-3 sm:flex-row"
            >
              <label for="busca-demandas" class="sr-only"
                >Buscar demanda por título ou OSC</label
              >
              <input
                id="busca-demandas"
                name="busca"
                type="search"
                placeholder="Buscar por título ou OSC"
                autocomplete="off"
                class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-orange-400 dark:border-slate-700 dark:bg-slate-800 dark:text-white"
              />

              <label for="filtro-status-demanda" class="sr-only"
                >Filtrar por status</label
              >
              <select
                id="filtro-status-demanda"
                name="status"
                class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-orange-400 dark:border-slate-700 dark:bg-slate-800 dark:text-white sm:w-56"
              >
                <option value="">Todos os status</option>
                <option value="Pendente">Pendente</option>
                <option value="Em andamento">Em andamento</option>
              </select>
            </form>
          </section>

          <ul id="itens-demandas" class="space-y-3"></ul>
          <p
            id="sem-demandas"
            class="text-sm text-slate-500 dark:text-slate-400"
          >
            Nenhuma demanda cadastrada ainda. Clique em "+ Nova demanda".
          </p>
          <p class="mt-4 text-xs text-slate-500 dark:text-slate-400">
            * Demandas concluídas saem desta lista e aparecem no Relatório
            anual.
          </p>
        </section>
