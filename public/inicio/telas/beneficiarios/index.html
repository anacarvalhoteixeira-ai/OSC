<section id="pagina-beneficiarios" data-pagina class="hidden" aria-labelledby="titulo-beneficiarios">
  <header class="mb-6 flex flex-wrap items-start justify-between gap-4">
    <div><h2 id="titulo-beneficiarios" class="text-2xl font-bold text-[#122957] dark:text-white">Pessoas atendidas</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-300">Alunos e beneficiados das organizações.</p></div>
    <button id="nova-pessoa-atendida" type="button" class="btn-primario" hidden>+ Cadastrar beneficiado</button>
  </header>
  <form id="filtros-beneficiarios" class="mb-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
    <label>Nome<input name="busca" type="search" maxlength="120" placeholder="Buscar pessoa" class="campo-beneficiario"></label>
    <label>Tipo<select name="tipo" class="campo-beneficiario"><option value="">Todos</option value="ALUNO">Aluno(a)</option><option value="BENEFICIARIO">Beneficiado(a)</option></select></label>
    <label>Situação<select name="ativo" class="campo-beneficiario"><option value="true">Ativos</option><option value="false">Inativos</option><option value="todos">Todos</option></select></label>
    <label id="filtro-beneficiario-osc" hidden>OSC<select name="organizacaoId" class="campo-beneficiario"><option value="">Todas as OSCs</option></select></label>
    <button type="submit" class="btn-secundario">Buscar</button>
  </form>
  <form id="form-pessoa-atendida" class="mb-6 rounded-2xl border border-slate-200 bg-white p-5 dark:border-slate-700 dark:bg-slate-800" hidden>
    <h3 id="titulo-form-beneficiario" class="mb-4 text-lg font-bold">Cadastrar beneficiado</h3>
    <div class="grid gap-4 sm:grid-cols-2">
      <label>Nome completo *<input name="nome" required minlength="2" maxlength="120" autocomplete="name" class="campo-beneficiario"></label>
      <label>Tipo *<select name="tipo" required class="campo-beneficiario"><option value="ALUNO">Aluno(a)</option><option value="BENEFICIARIO">Beneficiado(a)</option></select></label>
      <label>Data de nascimento<input name="dataNascimento" type="date" min="1900-01-01" class="campo-beneficiario"></label>
      <label>Telefone<input name="telefone" type="tel" maxlength="20" autocomplete="tel" class="campo-beneficiario"></label>
      <label>Nome do responsável, se necessário<input name="responsavel" maxlength="120" class="campo-beneficiario"></label>
      <label class="flex items-center gap-2"><input name="ativo" type="checkbox" checked>Cadastro ativo</label>
    </div>
    <p id="feedback-form-beneficiario" role="status" class="my-3 text-sm"></p>
    <div class="flex flex-wrap gap-3"><button type="submit" class="btn-primario">Salvar cadastro</button><button id="cancelar-beneficiario" type="button" class="btn-secundario">Cancelar</button></div>
  </form>
  <p id="feedback-beneficiarios" role="status" class="mb-4 text-sm"></p>
  <ul id="lista-beneficiarios" class="grid gap-4" aria-label="Pessoas atendidas"></ul>
  <div class="mt-5 flex items-center gap-4"><button id="beneficiarios-anterior" type="button" class="btn-secundario" disabled>Anterior</button><span id="beneficiarios-pagina" class="text-sm"></span><button id="beneficiarios-proxima" type="button" class="btn-secundario" disabled>Próxima</button></div>
</section>
