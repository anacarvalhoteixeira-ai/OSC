
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UOSCC</title>
    <link rel="stylesheet" href="./public/frontend_externo/login/login.css">
</head>
<body>

    <main class="pagina-login">
        <section class="card-login">

            <header class="cabecalho">
                <div class="logo">U</div>

                <div class="identidade">
                    <h1>UOSCC</h1>
                    <p>Rede de OSCs • Camaçari</p>
                </div>
            </header>

            <div class="conteudo">
                <div class="introducao">
                    <span class="etiqueta">ÁREA RESTRITA</span>
                    <h2>Bem-vindo de volta!</h2>
                    <p>Acesse o sistema da rede UOSCC.</p>
                </div>

                <form action="#" method="post">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@exemplo.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div class="opcoes">
                        <label class="lembrar">
                            <input type="checkbox" name="lembrar">
                            Manter conectado
                        </label>

                        <a href="#" class="link">
                            Esqueci minha senha
                        </a>
                    </div>

                    <button type="submit" class="botao" id="login">
                        Entrar 
                    </button>
                </form>

                <div class="alternativa">
                    <p>Ainda não possui uma conta?</p>
                    <a href="./public/frontend_externo/cadastro/cadastro.html" class="link">
                        Criar cadastro
                    </a>
                </div>

                <footer class="rodape">
                    Unindo forças para fortalecer organizações.
                </footer>
            </div>

        </section>

        <p class="legenda">
            UOSCC · Unindo forças, transformando comunidades.
        </p>
    </main>


    <script src="./public/frontend_externo/login/login.js"></script>
</body>
</html>
